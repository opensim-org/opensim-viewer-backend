[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osimConverters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "opensim>=4.6",
  "pygltflib",
]

[tool.setuptools]
packages = ["osimConverters"]
package-dir = { osimConverters = "." }
include-package-data = true

[tool.setuptools.package-data]
osimConverters = ["*.gltf", "Geometry/*", "Geometry/**/*"]